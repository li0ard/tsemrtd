name: Publish (NPM)
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun i
      
      - name: Build package
        run: bun run build
      
      - name: Publish package
        run: |
          npm publish --access public